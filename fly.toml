app = "trip-brain"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  WORKER_ENABLED = "true"
  MAX_ATTEMPTS = "5"

[http_service]
  internal_port = 3000
  force_https = true
  # The worker runs inside this process, so the machine must never be suspended and
  # exactly one instance must exist -- that is what makes the in-process job loop safe.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[mounts]
  source = "trip_brain_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
